plugins {
    id 'java'
    id 'application'
}

group = 'com.voxelgame'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// =========================================================================
// 1. KHAI BÁO PHIÊN BẢN THƯ VIỆN (libGDX 1.13.1)
// Chuyển đổi hoàn toàn từ LWJGL thuần + JOML + JLayer sang framework libGDX.
// libGDX đã bao gồm sẵn LWJGL 3, GLFW, OpenGL, STB, OpenAL và thư viện
// toán học (Vector3, Matrix4, MathUtils) nên không cần khai báo riêng.
// =========================================================================
project.ext.gdxVersion = "1.13.1"

// =========================================================================
// 2. KHAI BÁO CÁC GÓI THƯ VIỆN PHỤ THUỘC (DEPENDENCIES)
// - gdx: Module cốt lõi của libGDX (Toán học, Đồ họa, Âm thanh, Input, File I/O)
// - gdx-backend-lwjgl3: Backend Desktop dùng LWJGL 3 (Tạo cửa sổ, OpenGL, OpenAL)
// - gdx-platform natives-desktop: Thư viện C/C++ Native (.dll/.so/.dylib) tự động
//   nhận diện hệ điều hành (Windows, Linux, macOS) và kiến trúc CPU (x64, arm64)
// =========================================================================
dependencies {
    // Module cốt lõi của libGDX (Chứa toàn bộ API: Graphics, Audio, Input, Files, Math)
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    // Backend Desktop dùng LWJGL 3 (Quản lý cửa sổ GLFW, OpenGL Context, OpenAL Audio)
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

    // Thư viện Native tự động cho Desktop (Windows/Linux/macOS, x64/arm64)
    // Classifier "natives-desktop" gói chung tất cả native vào 1 JAR duy nhất
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

// =========================================================================
// 3. CẤU HÌNH CHẠY ỨNG DỤNG & TRÌNH BIÊN DỊCH JAVA
// =========================================================================
application {
    // Chỉ định class chứa hàm main() để khởi chạy game
    mainClass = 'com.voxelgame.Main'

    // Trên macOS, thư viện cửa sổ GLFW (nằm bên trong libGDX LWJGL3 backend)
    // bắt buộc phải chạy trên luồng đầu tiên (Main Thread) của tiến trình
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        applicationDefaultJvmArgs = ["-XstartOnFirstThread"]
    }
}

java {
    // Tương thích với JDK 17 trở lên (bao gồm JDK 17, 21, 26)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Đảm bảo trình biên dịch đọc đúng bảng mã UTF-8 (không bị lỗi font tiếng Việt trong chú thích)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
